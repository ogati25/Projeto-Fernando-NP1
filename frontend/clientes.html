<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Cadastro de Clientes</h1>
            <nav>
                <a href="index.html">Início</a>
                <a class="ativo" href="clientes.html">Clientes</a>
                <a href="veiculos.html">Veículos</a>
            </nav>
        </div>
    </header>

    <main class="conteudo">
        <section class="cadastro">
            <h2 id="titulo-formulario">Novo cliente</h2>
            <div id="mensagem" class="mensagem" role="status"></div>

            <form id="form-cliente">
                <input type="hidden" id="cliente-id">

                <label for="nome">Nome</label>
                <input type="text" id="nome" maxlength="120" placeholder="Digite o nome" required>

                <label for="cpf">CPF</label>
                <input type="text" id="cpf" maxlength="14" placeholder="000.000.000-00" required>

                <label for="telefone">Telefone</label>
                <input type="text" id="telefone" maxlength="20" placeholder="(00) 00000-0000">

                <label for="email">E-mail</label>
                <input type="email" id="email" maxlength="150" placeholder="Digite o e-mail">

                <label for="endereco">Endereço</label>
                <input type="text" id="endereco" maxlength="200" placeholder="Digite o endereço">

                <div class="acoes-formulario">
                    <button type="submit" id="btn-salvar">Salvar</button>
                    <button type="button" id="btn-cancelar" class="secundario" hidden>Cancelar</button>
                </div>
            </form>
        </section>

        <section class="lista">
            <div class="titulo-lista">
                <h2>Clientes cadastrados</h2>
                <input type="search" id="pesquisa" class="pesquisa" placeholder="Pesquisar por nome...">
            </div>

            <div class="tabela-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>CPF</th>
                            <th>Telefone</th>
                            <th>E-mail</th>
                            <th>Endereço</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-clientes"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/clientes.js"></script>
</body>
</html>
